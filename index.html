<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="9029スクリプト">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>9029スクリプト</title>
<style>
:root{--bg:#000;--card:#141518;--card2:#0C0D0F;--line:#26282D;--line2:#3A3E45;--tx:#F3F3F1;--sub:#C9CDD3;--mut:#A3A8B0;--ok:#2FD38A;--keep:#F2B134;--ng:#FF6B5E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}
.pill{height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill.out{background:transparent;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--keep)}
.h1{font-size:17px;font-weight:700}
.lbl{font-size:11px;color:var(--mut);letter-spacing:.04em}
.sec{font-size:12px;color:var(--mut)}
.card{background:var(--card);border-radius:16px;padding:14px;border:0;text-align:left;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.box{height:76px;border:0;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:30px;font-weight:900;line-height:1.15}
.step{width:34px;height:44px;border:0;background:transparent;color:var(--mut);font-size:24px}
.tcb{height:56px;border:1px solid var(--line);border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tcb b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px}
.tile{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:19px}
.tile.ch,.frow.ch{border:2px solid var(--keep)}
.chg{color:var(--keep);font-weight:700;margin-left:4px}
.frow{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;width:100%}
.frow span.v{flex:1;text-align:left;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub1{font-size:11px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;padding:0 4px}
.st{height:64px;border-radius:18px;font-size:22px;font-weight:900;background:transparent;border:2px solid}
.st.ok{color:var(--ok);border-color:var(--ok)}.st.keep{color:var(--keep);border-color:var(--keep)}.st.ng{color:var(--ng);border-color:var(--ng)}
.st.on{color:#000}.st.ok.on{background:var(--ok)}.st.keep.on{background:var(--keep)}.st.ng.on{background:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;padding:0 13px;border-radius:19px;font-size:14px;border:1px solid var(--line2);background:var(--card)}
.chip.on{border:0;background:var(--ng);color:#000;font-weight:700}
.chip.sel{border:0;background:var(--tx);color:#000;font-weight:700}
.inp{height:48px;width:100%;border:1px solid var(--line2);border-radius:12px;background:var(--card2);color:var(--tx);padding:0 12px;font-size:16px}
.inp::placeholder{color:#7D828A}
.primary{height:58px;border:0;border-radius:16px;background:var(--tx);color:#000;font-size:17px;font-weight:900;width:100%}
.primary:disabled{background:#2A2D33;color:var(--mut)}
.spacer{flex:1}
.badge{font-size:12px;font-weight:900;padding:2px 8px;border-radius:6px;color:#000}
.b-OK{background:var(--ok)}.b-KEEP{background:var(--keep)}.b-NG{background:var(--ng)}
.row{height:56px;border:0;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:12px;padding:0 14px 0 0;overflow:hidden;width:100%;text-align:left}
.row .bar{width:6px;align-self:stretch}
.row .code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:15px;font-weight:700;min-width:58px}
.row .note{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{font-size:12px;color:var(--mut);padding:6px 2px 0}
.list{border-radius:16px;background:var(--card);overflow:hidden}
.li{height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0 14px;width:100%;font-size:14px;color:var(--tx);text-decoration:none}
.li:last-child{border-bottom:0}
.li .k{color:var(--mut)}.li .v{font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;justify-content:center;padding:calc(110px + env(safe-area-inset-top)) 12px 0}
.sheet{position:relative;width:100%;max-width:456px;align-self:flex-start;background:#17191C;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:calc(100dvh - 140px);overflow-y:auto}
.opt{height:48px;border-radius:12px;font-size:15px;border:1px solid var(--line2);background:var(--card2)}
.opt.sel{border:0;background:var(--tx);color:#000;font-weight:700}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.warn{padding:12px 14px;border-radius:14px;background:#2A2418;border:1px solid #5A4A22;color:#E6DCC6;font-size:13px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.guide p{margin:0}
.guide .card{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.65;color:var(--sub)}
.guide .card b{color:var(--tx);font-size:15px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#000;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:20}
.logo{width:150px;height:auto;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:56px;border-radius:14px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button.on{border:2px solid var(--keep);background:var(--card)}
.script{border:0;text-align:left;padding:10px 14px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:2px;width:100%}
.script .hd{font-size:15px;font-weight:700}
.script .ln{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.75;color:var(--sub)}
.sbody .dl{color:var(--tx)}.sbody .dl b{color:var(--keep);font-weight:700;margin-right:2px}
.sbody .x{text-align:center;color:var(--mut)}
.srow{border:0;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.srow .no{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:700;font-size:16px;min-width:34px}
.srow .hd{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;white-space:nowrap}
.t-ok{background:var(--ok);color:#000}.t-wip{background:var(--keep);color:#000}.t-none{border:1px solid var(--line2);color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
var KEY='9029script.v1';
var LENS=['18mm','21mm','24mm','25mm','28mm','35mm','40mm','50mm','75mm','85mm','100mm','135mm','その他'];
var LTYPE=['ZEISS','Simera-C','その他'];
var IRIS=['F1.4','F2','F2.8','F4','F5.6','F8','その他'];
var WB=['3200K','4300K','5000K','5600K','6500K','その他'];
var ND=[['なし','なし'],['0.3','0.3 (ND2)'],['0.6','0.6 (ND4)'],['0.9','0.9 (ND8)'],['1.2','1.2 (ND16)'],['1.5','1.5 (ND32)'],['1.8','1.8 (ND64)'],['2.1','2.1 (ND128)'],['2.4','2.4 (ND256)']];
var REASONS=['芝居','セリフ','カメラワーク','フォーカス','音声','照明','美術・小道具','その他'];
var FPS=['23.976','24','25','29.97','30'];
var FPSR={'23.976':24000/1001,'24':24,'25':25,'29.97':30000/1001,'30':30};
var WK='日月火水木金土';

function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s){if(!s)return'';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return pad(d.getMonth()+1)+'/'+pad(d.getDate())+'('+WK[d.getDay()]+')';}
function nowStamp(){var d=new Date();return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function clone(o){return JSON.parse(JSON.stringify(o));}

function defCam(body){return {body:body,lensType:'',lensTypeCustom:'',lens:'35mm',lensCustom:'',iris:'F2.8',irisCustom:'',wb:'5600K',wbCustom:'',nd:'なし',fx:'',iso:'800',shutter:'180°',fps:'24',format:'BRAW'};}
function defaults(){
  var p={id:'p'+uid(),name:'One'};
  return {settings:{projects:[p],projectId:p.id,cams:{A:defCam('URSA Cine 12K LF'),B:defCam('PYXIS 6K')},lastCam:{},activeCam:'A',tc:{},session:null,cur:{scene:'1',cut:'1',take:1},updatedAt:0},days:{}};
}
var D;
try{D=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){D=null;}
if(!D||!D.settings)D=defaults();
if(!D.scripts)D.scripts={};

var S={view:'home',dayKey:null,scene:'all',editId:null,draft:null,camSel:null,rec:{status:null,reasons:{},memo:'',tcIn:'',tcOut:'',inF:null,outF:null},sheet:null,syncNote:''};

/* ---------- storage + sync ---------- */
var db=null,uidv=null,dirty={},flushT=null;
function persist(docIds){
  try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}
  (docIds||[]).forEach(function(k){dirty[k]=1;});
  if(db&&uidv){clearTimeout(flushT);flushT=setTimeout(flush,1200);}
}
function touchSettings(){D.settings.updatedAt=Date.now();persist(['settings']);}
function dayDocId(k){return 'day_'+k.replace(/[^A-Za-z0-9_\-]/g,'_');}
function flush(){
  if(!db||!uidv)return;
  var ks=Object.keys(dirty);dirty={};
  var col=db.collection('data/users/'+uidv);
  (function next(){
    if(!ks.length)return;
    var k=ks.shift(),p;
    if(k==='settings')p=col.doc('settings').set({settings:D.settings,updatedAt:D.settings.updatedAt});
    else if(k.indexOf('script:')===0){var pid=k.slice(7),sc=D.scripts[pid];p=sc?col.doc('script_'+pid).set({pid:pid,script:sc,updatedAt:sc.updatedAt||0}):col.doc('script_'+pid).delete();}
    else{var day=D.days[k];p=day?col.doc(dayDocId(k)).set({key:k,day:day,updatedAt:day.updatedAt}):col.doc(dayDocId(k)).delete();}
    p.then(next,function(e){if(e&&e.code==='quota_exceeded')toast('保存領域がいっぱいです');dirty[k]=1;next();});
  })();
}
/* ---------- helpers ---------- */
function proj(){var s=D.settings;return s.projects.filter(function(p){return p.id===s.projectId;})[0]||s.projects[0];}
function dayKey(date){return D.settings.projectId+'|'+date;}
function projDays(){var pid=D.settings.projectId;return Object.keys(D.days).filter(function(k){return k.indexOf(pid+'|')===0;}).map(function(k){return D.days[k];}).sort(function(a,b){return a.date<b.date?1:-1;});}
function cam(k){return D.settings.cams[k||D.settings.activeCam];}
function shown(c,k){
  if(k==='lens'||k==='iris'||k==='wb'||k==='lensType')return c[k]==='その他'?((c[k+'Custom']||'').trim()||'その他'):(c[k]||'');
  return c[k];
}
function script(){return D.scripts[D.settings.projectId]||null;}
function sceneNum(x){var m=String(x||'').match(/^\d+/);return m?m[0]:null;}
function findScene(x){var sc=script(),n=sceneNum(x);if(!sc||!n)return null;for(var i=0;i<sc.scenes.length;i++)if(sc.scenes[i].no===n)return sc.scenes[i];return null;}
function firstLine(sc){for(var i=0;i<sc.body.length;i++)if(sc.body[i]!=='×')return sc.body[i];return '';}
function sceneStatus(no){var r={takes:0,ok:0};projDays().forEach(function(d){d.takes.forEach(function(t){if(sceneNum(t.scene)===no){r.takes++;if(t.status==='OK')r.ok++;}});});return r;}
function bodyHtml(sc){return sc.body.map(function(p){if(p==='×')return '<div class="x">×　×　×</div>';var m=p.match(/^([^「」（）]{1,8})「([\s\S]*)$/);if(m)return '<div class="dl"><b>'+esc(m[1])+'</b>「'+esc(m[2])+'</div>';return '<div>'+esc(p)+'</div>';}).join('');}
function nextCut(c){var m=String(c).match(/^(\d+)/);return m?String(parseInt(m[1],10)+1):String(c);}
function ndLabel(v){for(var i=0;i<ND.length;i++)if(ND[i][0]===v)return ND[i][1];return v;}
function filterText(c){return 'ND '+ndLabel(c.nd)+((c.fx||'').trim()?' ・ '+c.fx.trim():'');}
function camSnap(k){var c=cam(k);return {cam:k,body:c.body,lensType:shown(c,'lensType'),lens:shown(c,'lens'),iris:shown(c,'iris'),wb:shown(c,'wb'),nd:ndLabel(c.nd),fx:(c.fx||'').trim(),iso:c.iso,shutter:c.shutter,fps:c.fps,format:c.format};}

/* TC */
function base(f){return Math.round(FPSR[f]||24);}
function tcFrames(k){
  var c=cam(k),f=c.fps,b=base(f),sy=D.settings.tc[k],now=Date.now(),day=86400*b,fr;
  if(sy&&sy.fps===f){fr=sy.F0+(now-sy.t0)/1000*FPSR[f];}
  else{var d=new Date();fr=((d.getHours()*60+d.getMinutes())*60+d.getSeconds()+d.getMilliseconds()/1000)*b;}
  fr=Math.floor(fr)%day;if(fr<0)fr+=day;return fr;
}
function fmtTC(fr,f){var b=base(f),ff=fr%b,s=Math.floor(fr/b),h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60;return pad(h)+':'+pad(m)+':'+pad(s%60)+':'+pad(ff);}
function parseTC(str,f){
  var d=tcDigits(str);if(d.length===6)d+='00';if(d.length!==8)return null;
  var h=+d.slice(0,2),m=+d.slice(2,4),s=+d.slice(4,6),ff=+d.slice(6,8),b=base(f);
  if(h>23||m>59||s>59||ff>=b)return null;return ((h*60+m)*60+s)*b+ff;
}
function tcDigits(str){return String(str||'').replace(/[\uFF10-\uFF19]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[^0-9]/g,'').slice(0,8);}
function tcFormat(d){return (d.match(/.{1,2}/g)||[]).join(':');}
function durOf(t){if(t.inF==null||t.outF==null)return'';var b=base(t.fps||'24'),d=t.outF-t.inF;if(d<0)d+=86400*b;var s=Math.round(d/b);return Math.floor(s/60)+':'+pad(s%60);}
function syncAge(k){var sy=D.settings.tc[k];if(!sy)return null;return (Date.now()-sy.t0)/3600000;}

function toast(msg){var el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove();},1800);}

/* ---------- views ---------- */
var app=document.getElementById('app'),layer=document.getElementById('layer');

function vHome(){
  var days=projDays(),total=0;days.forEach(function(d){total+=d.takes.length;});
  var ses=D.settings.session,sesOn=ses&&ses.projectId===D.settings.projectId;
  var h='<div class="top"><img class="logo" src="logo.png" alt="9029 works"><div style="display:flex;gap:8px"><button class="pill" data-go="script">台本</button><button class="pill" data-go="camera">カメラ</button><button class="pill" data-go="guide">使い方</button></div></div>';
  h+='<div style="font-size:13px;font-weight:700;letter-spacing:.06em">9029スクリプト</div>';
  h+='<button class="card" data-act="projects" style="display:flex;justify-content:space-between;align-items:center"><span><span class="lbl">プロジェクト</span><br><span style="font-size:26px;font-weight:900">'+esc(proj().name)+'</span></span><span class="sec">切替 ▾</span></button>';
  h+='<div class="sec" style="display:flex;gap:14px"><span>撮影日数 <b style="color:var(--tx)">'+days.length+'</b></span><span>総テイク <b style="color:var(--tx)">'+total+'</b></span></div>';
  if(sesOn)h+='<button class="card" data-go="record" style="border:2px solid var(--keep);display:flex;justify-content:space-between;align-items:center"><span><span class="lbl">撮影中</span><br><b style="font-size:18px">'+fmtDate(ses.date)+'　S'+esc(D.settings.cur.scene)+'-C'+esc(D.settings.cur.cut)+'-T'+D.settings.cur.take+'</b></span><span style="font-weight:700">記録に戻る ›</span></button>';
  h+='<div class="sec">撮影ログ</div>';
  if(days.length)h+='<div class="note" style="margin-top:-6px">カードを長押しすると撮影日ごと削除できます</div>';
  if(!days.length)h+='<div class="card note">まだ記録がありません。下の「新しい撮影を始める」から記録を始めてください。</div>';
  days.forEach(function(d){
    var c={OK:0,KEEP:0,NG:0},sc=[],cams={};
    d.takes.forEach(function(t){c[t.status]=(c[t.status]||0)+1;if(sc.indexOf(t.scene)<0)sc.push(t.scene);cams[t.cam]=1;});
    h+='<button class="card hold" data-day="'+esc(dayKey(d.date))+'" style="display:flex;flex-direction:column;gap:8px"><span style="display:flex;justify-content:space-between;align-items:baseline;width:100%"><b style="font-size:18px">'+fmtDate(d.date)+'</b><span class="sec">'+d.takes.length+' テイク</span></span><span style="font-size:13px;color:var(--sub)">'+esc(sc.map(function(s){return 'S'+s;}).join(' ・ '))+'</span><span style="display:flex;gap:6px;align-items:center;width:100%"><span class="badge b-OK">OK '+c.OK+'</span><span class="badge b-KEEP">保留 '+c.KEEP+'</span><span class="badge b-NG">NG '+c.NG+'</span><span class="mono sec" style="margin-left:auto">'+Object.keys(cams).sort().map(function(k){return k+' CAM';}).join(' ／ ')+'</span></span></button>';
  });
  h+='<div class="spacer"></div><button class="primary" data-act="newShoot" style="position:sticky;bottom:12px;height:64px;font-size:18px">＋ 新しい撮影を始める</button>';
  return h;
}

function vRecord(){
  var s=D.settings,k=s.activeCam,c=cam(),pv=s.lastCam[k]||null,r=S.rec,ses=s.session;
  function ch(key){if(!pv)return false;if(key==='lens'&&shown(c,'lensType')!==shown(pv,'lensType'))return true;return key==='filter'?(c.nd!==pv.nd||(c.fx||'').trim()!==(pv.fx||'').trim()):shown(c,key)!==shown(pv,key);}
  var age=syncAge(k);
  var h='<div class="top"><div style="display:flex;align-items:center;gap:8px"><button class="pill out" data-go="home" style="font-weight:700">‹ ホーム</button><button class="pill out" data-act="editDate" style="font-weight:700">撮影 '+fmtDate(ses?ses.date:today())+' ▾</button></div><div style="display:flex;gap:8px"><button class="pill" data-day="'+esc(dayKey(ses?ses.date:today()))+'">一覧</button><button class="pill" data-act="swapCam" style="font-weight:700"><span class="dot" style="background:'+(k==='A'?'var(--keep)':'#6FA8FF')+'"></span>'+k+' CAM</button></div></div>';

function commit(){
  var s=D.settings,ses=s.session,k=s.activeCam,r=S.rec;if(!r.status)return;
  var key=dayKey(ses.date),day=D.days[key];
  if(!day)day=D.days[key]={projectId:s.projectId,date:ses.date,takes:[],updatedAt:0};
  var snap=camSnap(k),now=Date.now();
  var t={id:uid('t'),date:ses.date,scene:String(s.cur.scene),cut:String(s.cur.cut),take:s.cur.take,status:r.status,reasons:REASONS.filter(function(x){return r.reasons[x];}),memo:r.memo.trim(),tcIn:r.tcIn,tcOut:r.tcOut,inF:r.inF,outF:r.outF,createdAt:now,createdLabel:nowStamp(),updatedAt:now,history:[]};
  for(var x in snap)t[x]=snap[x];
  if(t.status!=='NG')t.reasons=[];
  day.takes.push(t);day.updatedAt=now;
  s.lastCam[k]=clone(cam(k));
  if(t.status==='OK'){s.cur.cut=nextCut(s.cur.cut);s.cur.take=1;}else s.cur.take+=1;
  s.updatedAt=now;
  S.rec={status:null,reasons:{},memo:'',tcIn:'',tcOut:'',inF:null,outF:null};

}
function openEdit(id){
  var day=D.days[S.dayKey];if(!day)return;var t=day.takes.filter(function(x){return x.id===id;})[0];if(!t)return;
  S.editId=id;S.draft=clone(t);if(S.draft.lensType==null)S.draft.lensType='';S.draft.take=String(t.take);go('edit');
}
function saveEdit(){
  var day=D.days[S.dayKey];if(!day)return;var i=-1;day.takes.forEach(function(x,j){if(x.id===S.editId)i=j;});if(i<0)return;
  var old=day.takes[i],d=S.draft,b=clone(old);delete b.history;
  var n=clone(old);['scene','cut','status','memo','tcIn','tcOut','lensType','lens','iris','wb','nd','fx'].forEach(function(k){n[k]=typeof d[k]==='string'?d[k].trim():d[k];});
  n.take=parseInt(d.take,10)||old.take;n.reasons=d.status==='NG'?d.reasons.slice():[];
  var f=old.fps||'24',a=parseTC(n.tcIn,f),o=parseTC(n.tcOut,f);n.inF=a;n.outF=o;
  var changed=JSON.stringify(b)!==JSON.stringify((function(){var c=clone(n);delete c.history;return c;})());
  if(!changed){toast('変更はありません');return;}
  n.history=(old.history||[]).concat([{at:nowStamp(),before:b}]);n.updatedAt=Date.now();
  day.takes[i]=n;day.updatedAt=n.updatedAt;persist([S.dayKey]);S.draft=clone(n);S.draft.take=String(n.take);render();toast('保存しました');
}
function deleteTake(){
  var day=D.days[S.dayKey];if(!day)return;day.takes=day.takes.filter(function(x){return x.id!==S.editId;});day.updatedAt=Date.now();
  if(!day.takes.length)delete D.days[S.dayKey];
  persist([S.dayKey]);S.draft=null;S.view='day';prevViews.pop();render();toast('削除しました');

var holdT=null;
function wireHold(){
  [['holdSave','var(--ok)','var(--tx)',saveEdit,'保存中… 指を離すと取消','長押しで保存（2秒）'],['holdDel','var(--ng)','transparent',deleteTake,'削除中…','長押しで削除']].forEach(function(cfg){
    var el=document.getElementById(cfg[0]);if(!el)return;
    function reset(){clearInterval(holdT);holdT=null;el.style.background=cfg[2];el.textContent=cfg[5];if(cfg[0]==='holdDel')el.style.color='var(--ng)';}
    el.addEventListener('pointerdown',function(e){e.preventDefault();clearInterval(holdT);var t0=Date.now();el.textContent=cfg[4];if(cfg[0]==='holdDel')el.style.color='#000';
      holdT=setInterval(function(){var p=Math.min(1,(Date.now()-t0)/2000);el.style.background='linear-gradient(90deg,'+cfg[1]+' '+(p*100)+'%,'+cfg[2]+' '+(p*100)+'%)';if(p>=1){clearInterval(holdT);holdT=null;reset();cfg[3]();}},30);});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){el.addEventListener(ev,function(){if(holdT)reset();});});
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
}
var dayBlock=0;
function wireDayHold(){
  app.querySelectorAll('.card[data-day]').forEach(function(el){
    var tm=null,x0=0,y0=0;
    function cancel(){clearTimeout(tm);tm=null;el.style.transform='';}
    el.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;clearTimeout(tm);el.style.transform='scale(0.98)';
      tm=setTimeout(function(){tm=null;el.style.transform='';dayBlock=Date.now();openDelDay(el.dataset.day);},600);});
    el.addEventListener('pointermove',function(e){if(tm&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10))cancel();});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){el.addEventListener(ev,function(){if(tm)cancel();});});
    el.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
}

function shareFile(name,text,type){
  var safe=name.replace(/[\\/:*?"<>|]/g,'_');
  try{var f=new File([text],safe,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:safe}).then(function(){toast('共有しました');},function(e){if(e&&e.name!=='AbortError')dl();});return;}
  }catch(e){}
  dl();
  function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=safe;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('保存しました');}
}
function csvOf(day){
  var head=['撮影日','シーン','カット','テイク','判定','NG理由','TC IN','TC OUT','尺','カメラ','ボディ','レンズ種類','レンズ','絞り','WB','ND','エフェクト','ISO','シャッター','fps','メモ','修正'];
  var rows=day.takes.slice().sort(function(a,b){return a.createdAt-b.createdAt;}).map(function(t){return [t.date,t.scene,t.cut,t.take,{OK:'OK',KEEP:'保留',NG:'NG'}[t.status],(t.reasons||[]).join('・'),t.tcIn,t.tcOut,durOf(t),t.cam,t.body,t.lensType||'',t.lens,t.iris,t.wb,t.nd,t.fx,t.iso,t.shutter,t.fps,t.memo,(t.history||[]).length];});
  return [head].concat(rows).map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\n');
}
function setDeep(path,val){var p=path.split('.');if(p[0]==='rec')S.rec[p[1]]=val;else if(p[0]==='draft'&&S.draft)S.draft[p[1]]=val;}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-go],[data-back],[data-day],[data-edit],[data-st],[data-reason],[data-dst],[data-dreason],[data-pick],[data-opt],[data-topt],[data-scene],[data-camsel],[data-field],[data-proj],[data-nscam],[data-tcfps],[data-nudge],[data-scn],[data-usescn],[data-sf]');
  if(!t){return;}
  var d=t.dataset,s=D.settings;
  if(d.act==='sheetBg'){if(e.target===t)closeSheet();return;}
  if(d.scn){openSheet({type:'scene',no:d.scn});return;}
  if(d.usescn){s.cur.scene=d.usescn;s.cur.cut='1';s.cur.take=1;touchSettings();closeSheet();if(S.view!=='record'){S.view='record';render();}return;}

  if(d.go){go(d.go);return;}
  if(d.back){if(d.back==='day'){S.draft=null;}back();return;}
  if(d.day){if(Date.now()-dayBlock<800)return;S.dayKey=d.day;S.scene='all';go('day');return;}
  if(d.edit){openEdit(d.edit);return;}
  if(d.st){S.rec.status=S.rec.status===d.st?null:d.st;render();return;}
  if(d.reason){S.rec.reasons[d.reason]=!S.rec.reasons[d.reason];render();return;}
  if(d.dst){S.draft.status=d.dst;render();return;}
  if(d.dreason){var a=S.draft.reasons,i=a.indexOf(d.dreason);if(i>=0)a.splice(i,1);else a.push(d.dreason);render();return;}
  if(d.pick){openSheet({type:'pick',key:d.pick,cam:S.view==='camera'?(S.camSel||s.activeCam):s.activeCam});return;}
  if(d.opt){var c=cam(S.sheet.cam);c[d.opt]=d.val;touchSettings();renderSheet();return;}
  if(d.topt){S.sheet.value=d.topt;applyText();return;}
  if(d.scene){S.scene=d.scene;render();return;}
  if(d.camsel){var ci=document.getElementById('camTC');if(ci)S.tcDraft=ci.value;S.camSel=d.camsel;render();return;}
  if(d.tcfps){var kk=S.camSel||s.activeCam,ci2=document.getElementById('camTC');if(ci2)S.tcDraft=ci2.value;if(cam(kk).fps!==d.tcfps){cam(kk).fps=d.tcfps;if(s.tc[kk]){delete s.tc[kk];toast('fpsを変えたので、もう一度合わせてください');}touchSettings();}render();return;}
  if(d.nudge){var kn=S.camSel||s.activeCam,n=parseInt(d.nudge,10),b0=base(cam(kn).fps),ci3=document.getElementById('camTC');if(ci3)S.tcDraft=ci3.value;
    if(!s.tc[kn]||s.tc[kn].fps!==cam(kn).fps)s.tc[kn]={t0:Date.now(),F0:tcFrames(kn),fps:cam(kn).fps,at:nowStamp()};
    s.tc[kn].F0+=Math.round(n*b0/24);s.tc[kn].at=nowStamp();touchSettings();render();return;}
  if(d.field){var k=S.camSel||s.activeCam;openSheet({type:'text',title:{body:'ボディ',iso:'ISO',shutter:'シャッター',fps:'fps',format:'収録形式'}[d.field]+'（'+k+' CAM）',target:'cam',cam:k,key:d.field,value:cam(k)[d.field],options:d.field==='fps'?FPS:null});return;}
  if(d.proj){s.projectId=d.proj;touchSettings();closeSheet();return;}
  if(d.nscam){S.sheet.cams[d.nscam]=!S.sheet.cams[d.nscam];readNewShoot();renderSheet();return;}
  switch(d.act){
    case 'sheetDone':if(S.sheet&&S.sheet.type==='sesDate'){var dv=document.getElementById('sesDateInp').value;if(dv&&s.session){s.session.date=dv;touchSettings();toast('撮影日を '+fmtDate(dv)+' にしました');}closeSheet();}
      else if(S.sheet&&S.sheet.type==='text'){var si=document.getElementById('sheetInput');if(si)S.sheet.value=si.value;applyText();}else closeSheet();break;
    case 'sheetClose':closeSheet();break;
    case 'unloadScript':S.sheet={type:'confirmUnload'};layer.innerHTML='<div class="overlay" data-act="sheetBg"><div class="sheet"><span class="h1">台本を外しますか？</span><div class="note">記録したテイクは消えません。外したあと、別の台本を読み込めます。</div><div class="g2"><button class="opt" data-act="sheetClose">やめる</button><button class="opt" data-act="doUnload" style="border-color:var(--ng);color:var(--ng)">外す</button></div></div></div>';break;
    case 'doUnload':delete D.scripts[D.settings.projectId];persist(['script:'+D.settings.projectId]);closeSheet();break;
    case 'projects':openSheet({type:'projects'});break;
    case 'addProj':var nv=(document.getElementById('newProj').value||'').trim();if(!nv)return;var p={id:'p'+uid(),name:nv};s.projects.push(p);s.projectId=p.id;touchSettings();closeSheet();break;

    case 'startShoot':readNewShoot();var ns=S.sheet;if(!ns.date)return;var cs=['A','B'].filter(function(x){return ns.cams[x];});if(!cs.length)cs=['A'];
      s.session={projectId:s.projectId,date:ns.date,cams:cs};s.activeCam=cs[0];s.cur={scene:ns.scene.trim()||'1',cut:ns.cut.trim()||'1',take:parseInt(ns.take,10)||1};touchSettings();S.sheet=null;layer.innerHTML='';prevViews=['home'];S.view='record';render();break;
    case 'editDate':openSheet({type:'sesDate',value:(s.session&&s.session.date)||today()});break;

    case 'takeMinus':s.cur.take=Math.max(1,s.cur.take-1);touchSettings();render();break;
    case 'takePlus':s.cur.take+=1;touchSettings();render();break;
    case 'tcIn':var f=tcFrames(s.activeCam);S.rec.inF=f;S.rec.tcIn=fmtTC(f,cam().fps);S.rec.outF=null;S.rec.tcOut='';render();break;
    case 'tcOut':var g=tcFrames(s.activeCam);S.rec.outF=g;S.rec.tcOut=fmtTC(g,cam().fps);render();break;
    case 'swapCam':var sc=(s.session&&s.session.cams)||['A'];if(sc.length>1){s.activeCam=s.activeCam==='A'?'B':'A';touchSettings();render();}else{S.camSel=s.activeCam;go('camera');}break;
    case 'commit':commit();break;
    case 'useCam':s.activeCam=S.camSel||s.activeCam;if(s.session&&s.session.cams.indexOf(s.activeCam)<0)s.session.cams.push(s.activeCam);touchSettings();if(s.session){S.view='record';render();}else back();break;
    case 'tcNow':var k=S.camSel||s.activeCam,inp=document.getElementById('camTC'),fr=parseTC(inp.value,cam(k).fps);S.tcDraft=inp.value;
      if(fr==null){toast('TCは「時分秒」6桁か「時分秒フレーム」8桁で入れてください');return;}
      s.tc[k]={t0:Date.now(),F0:fr,fps:cam(k).fps,at:nowStamp()};touchSettings();S.tcDraft='';render();toast(k+' CAM のTCを合わせました');break;
    case 'tcClear':delete s.tc[S.camSel||s.activeCam];touchSettings();render();break;
    case 'export':openSheet({type:'export',csv:csvOf(D.days[S.dayKey])});break;
    case 'copyCsv':var ta=document.getElementById('csvText');(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(function(){toast('コピーしました');},function(){ta.select();toast('選択した文字をコピーしてください');});break;
    case 'saveCsv':var day=D.days[S.dayKey];shareFile('9029script_'+proj().name+'_'+day.date+'.csv','\ufeff'+S.sheet.csv,'text/csv');break;
    case 'backup':shareFile('9029script_backup_'+today()+'.json',JSON.stringify(D),'application/json');break;
  }
});
function readNewShoot(){var s=S.sheet;if(!s||s.type!=='newShoot')return;['Date','Scene','Cut','Take'].forEach(function(k){var el=document.getElementById('ns'+k);if(el)s[k.toLowerCase()]=el.value;});}
function applyText(){
  var s=S.sheet,v=String(s.value).trim();if(!v){closeSheet();return;}
  if(s.target==='cur'){var cu=D.settings.cur;if(s.key==='scene'&&v!==String(cu.scene)){cu.cut='1';cu.take=1;}else if(s.key==='cut'&&v!==String(cu.cut)){cu.take=1;}cu[s.key]=v;}
  else if(s.target==='cam'){cam(s.cam)[s.key]=v;if(s.key==='fps'&&D.settings.tc[s.cam]&&D.settings.tc[s.cam].fps!==v)toast('fpsを変えたのでTCを合わせ直してください');}
  touchSettings();closeSheet();
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='camTC'){var dg=tcDigits(t.value);t.value=tcFormat(dg);S.tcDraft=t.value;}
  if(t.dataset.bind){setDeep(t.dataset.bind,t.value);if(t.dataset.bind.indexOf('rec.')===0){}}
  if(t.dataset.cbind&&S.sheet){cam(S.sheet.cam)[t.dataset.cbind]=t.value;D.settings.updatedAt=Date.now();clearTimeout(t._sv);t._sv=setTimeout(function(){touchSettings();},500);}
});
document.addEventListener('change',function(e){
  if(e.target.id==='restoreFile'&&e.target.files[0]){var rf=new FileReader();rf.onload=function(){try{var o=JSON.parse(rf.result);if(!o.settings||!o.days)throw 0;if(!o.scripts)o.scripts={};D=o;persist();S.view='home';prevViews=[];render();toast('バックアップを読み込みました');}catch(x){toast('バックアップファイルを読めませんでした');}};rf.readAsText(e.target.files[0]);return;}
  if(e.target.id!=='scriptFile'||!e.target.files[0])return;
  var fr=new FileReader();fr.onload=function(){try{loadScriptObj(JSON.parse(fr.result));}catch(x){toast('台本データを読めませんでした');}};fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sheetInput'){S.sheet.value=e.target.value;applyText();}});

render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
})();
</script>
</body>
