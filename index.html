<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="9029スクリプト">

<title>9029スクリプト</title>
<style>
:root{--bg:#000;--card:#141518;--card2:#0C0D0F;--line:#26282D;--line2:#3A3E45;--tx:#F3F3F1;--sub:#C9CDD3;--mut:#A3A8B0;--ok:#2FD38A;--keep:#F2B134;--ng:#FF6B5E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}
.pill{height:38px;padding:0 12px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill.out{background:transparent;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--keep)}
.h1{font-size:17px;font-weight:700}
.lbl{font-size:11px;color:var(--mut);letter-spacing:.04em}
.sec{font-size:12px;color:var(--mut)}
.card{background:var(--card);border-radius:16px;padding:14px;border:0;text-align:left;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.box{height:76px;border:0;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:30px;font-weight:900;line-height:1.15}
.step{width:34px;height:44px;border:0;background:transparent;color:var(--mut);font-size:24px}
.tcb{height:56px;border:1px solid var(--line);border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tcb b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px}
.tile{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:19px}

.chg{color:var(--keep);font-weight:700;margin-left:4px}
.frow{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;width:100%}
.frow span.v{flex:1;text-align:left;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub1{font-size:11px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;padding:0 4px}
.st{height:64px;border-radius:18px;font-size:22px;font-weight:900;background:transparent;border:2px solid}
.st.ok{color:#5AC8FA;border-color:#5AC8FA}.st.keep{color:var(--keep);border-color:var(--keep)}.st.ng{color:var(--ng);border-color:var(--ng)}
.st.on{color:#000}.st.ok.on{background:var(--ok)}.st.keep.on{background:var(--keep)}.st.ng.on{background:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;padding:0 13px;border-radius:19px;font-size:14px;border:1px solid var(--line2);background:var(--card)}
.chip.on{border:0;background:var(--ng);color:#000;font-weight:700}
.chip.sel{border:0;background:var(--tx);color:#000;font-weight:700}
.inp{height:48px;width:100%;border:1px solid var(--line2);border-radius:12px;background:var(--card2);color:var(--tx);padding:0 12px;font-size:16px}
.inp::placeholder{color:#7D828A}
.primary{height:58px;border:0;border-radius:16px;background:var(--tx);color:#000;font-size:17px;font-weight:900;width:100%}
.primary:disabled{background:#2A2D33;color:var(--mut)}
.spacer{flex:1}
.badge{font-size:12px;font-weight:900;padding:2px 8px;border-radius:6px;color:#000}
.b-OK{background:var(--ok)}.b-KEEP{background:var(--keep)}.b-NG{background:var(--ng)}
.row{height:56px;border:0;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:12px;padding:0 14px 0 0;overflow:hidden;width:100%;text-align:left}
.row .bar{width:6px;align-self:stretch}
.row .code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:15px;font-weight:700;min-width:58px}
.row .note{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{font-size:12px;color:var(--mut);padding:6px 2px 0}
.list{border-radius:16px;background:var(--card);overflow:hidden}
.li{height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0 14px;width:100%;font-size:14px;color:var(--tx);text-decoration:none}
.li:last-child{border-bottom:0}
.li .k{color:var(--mut)}.li .v{font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;justify-content:center;padding:calc(110px + env(safe-area-inset-top)) 12px 0}
.sheet{position:relative;width:100%;max-width:456px;align-self:flex-start;background:#17191C;border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:calc(100dvh - 140px);overflow-y:auto}
.opt{height:48px;border-radius:12px;font-size:15px;border:1px solid var(--line2);background:var(--card2)}
.opt.sel{border:0;background:var(--tx);color:#000;font-weight:700}
.camrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.camchip{height:44px;min-width:58px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line2);background:transparent;color:var(--mut);font-weight:900;font-size:18px}
.camchip.on.cA{background:#FF5A4E;color:#000;border-color:#FF5A4E}.camchip.on.cB{background:#F2B134;color:#000;border-color:#F2B134}.camchip.on.cC{background:#2FD38A;color:#000;border-color:#2FD38A}
.ctag{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:900;color:#000;margin-right:4px}
.mbtn{height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left}
.mbtn b{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wheelbox{position:relative}
.wheel{height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:20px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.wi.on{color:var(--tx);font-weight:900;font-size:24px}
.wi small{font-size:12px;font-weight:400;margin-left:8px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.wpad{height:88px}
.wband{position:absolute;left:0;right:0;top:88px;height:44px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:10px;pointer-events:none}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.warn{padding:12px 14px;border-radius:14px;background:#2A2418;border:1px solid #5A4A22;color:#E6DCC6;font-size:13px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.guide p{margin:0}
.guide .card{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.65;color:var(--sub)}
.guide .card b{color:var(--tx);font-size:15px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#000;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:20}
.logo{width:150px;height:auto;display:block}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{height:56px;border-radius:14px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button.on{border:2px solid var(--keep);background:var(--card)}
.script{border:0;text-align:left;padding:10px 14px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:2px;width:100%}
.script .hd{font-size:15px;font-weight:700}
.script .ln{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.75;color:var(--sub)}
.sbody .dl{color:var(--tx)}.sbody .dl b{color:var(--keep);font-weight:700;margin-right:2px}
.sbody .x{text-align:center;color:var(--mut)}
.srow{border:0;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.srow .no{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:700;font-size:16px;min-width:34px}
.srow .hd{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;white-space:nowrap}
.t-ok{background:var(--ok);color:#000}.t-wip{background:var(--keep);color:#000}.t-none{border:1px solid var(--line2);color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
var KEY='9029script.v1';
var LENS=['18mm','21mm','24mm','25mm','28mm','35mm','40mm','50mm','75mm','85mm','100mm','135mm','その他'];
var LTYPE=['ZEISS','Simera-C','その他'];
var IRISW=['F1.4','F1.7','F1.8','F2','F2.2','F2.5','F2.8','F3.2','F3.5','F4','F4.5','F5','F5.6','F6.3','F7.1','F8','F9','F10','F11','F13','F16','F22'];
var CAMS=['A','B','C'];
var CAMCOL={A:'#FF5A4E',B:'#F2B134',C:'#2FD38A'};
var SFX=['','A','B','C','D','E','F','G','H'];
var IRIS=['F1.4','F2','F2.8','F4','F5.6','F8','その他'];
var WB=['3200K','4300K','5000K','5600K','6500K','その他'];
var ND=[['なし','なし'],['0.3','0.3 (ND2)'],['0.6','0.6 (ND4)'],['0.9','0.9 (ND8)'],['1.2','1.2 (ND16)'],['1.5','1.5 (ND32)'],['1.8','1.8 (ND64)'],['2.1','2.1 (ND128)'],['2.4','2.4 (ND256)']];
var REASONS=['芝居','セリフ','カメラワーク','フォーカス','音声','照明','美術・小道具','その他'];
var FPS=['23.976','24','25','29.97','30'];
var FPSR={'23.976':24000/1001,'24':24,'25':25,'29.97':30000/1001,'30':30};
var WK='日月火水木金土';

function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s){if(!s)return'';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return pad(d.getMonth()+1)+'/'+pad(d.getDate())+'('+WK[d.getDay()]+')';}
function clock(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function nowStamp(){var d=new Date();return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function clone(o){return JSON.parse(JSON.stringify(o));}

function defCam(body){return {body:body,media:'',tstop:'T2.8',tLink:true,lensType:'',lensTypeCustom:'',lens:'35mm',lensCustom:'',iris:'F2.8',irisCustom:'',wb:'5600K',wbCustom:'',nd:'なし',fx:'',iso:'800',shutter:'180°',fps:'24',format:'BRAW'};}
function defaults(){
  var p={id:'p'+uid(),name:'One'};
  return {settings:{projects:[p],projectId:p.id,cams:{A:defCam('URSA Cine 12K LF'),B:defCam('PYXIS 6K'),C:defCam('')},lastCam:{},activeCam:'A',tc:{},session:null,cur:{scene:'1',cut:'1',take:1},updatedAt:0},days:{}};
}
var D;
try{D=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){D=null;}
if(!D||!D.settings)D=defaults();
if(!D.scripts)D.scripts={};
if(!D.settings.cams.C)D.settings.cams.C=defCam('');
CAMS.forEach(function(k){var c=D.settings.cams[k];if(c&&c.tstop==null){c.tstop=/^F/.test(c.iris)?'T'+c.iris.slice(1):'T2.8';c.tLink=true;}if(c&&c.media==null)c.media='';});

var S={view:'home',dayKey:null,scene:'all',editId:null,draft:null,camSel:null,rec:{status:null,reasons:{},memo:'',tcIn:'',tcOut:'',inF:null,outF:null},sheet:null,syncNote:''};

/* ---------- storage + sync ---------- */
var db=null,uidv=null,dirty={},flushT=null;
function persist(docIds){
  try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}
  (docIds||[]).forEach(function(k){dirty[k]=1;});
  if(db&&uidv){clearTimeout(flushT);flushT=setTimeout(flush,1200);}
}
function touchSettings(){D.settings.updatedAt=Date.now();persist(['settings']);}
function dayDocId(k){return 'day_'+k.replace(/[^A-Za-z0-9_\-]/g,'_');}
function flush(){
  if(!db||!uidv)return;
  var ks=Object.keys(dirty);dirty={};
  var col=db.collection('data/users/'+uidv);
  (function next(){
    if(!ks.length)return;
    var k=ks.shift(),p;
    if(k==='settings')p=col.doc('settings').set({settings:D.settings,updatedAt:D.settings.updatedAt});
    else if(k.indexOf('script:')===0){var pid=k.slice(7),sc=D.scripts[pid];p=sc?col.doc('script_'+pid).set({pid:pid,script:sc,updatedAt:sc.updatedAt||0}):col.doc('script_'+pid).delete();}
    else{var day=D.days[k];p=day?col.doc(dayDocId(k)).set({key:k,day:day,updatedAt:day.updatedAt}):col.doc(dayDocId(k)).delete();}
    p.then(next,function(e){if(e&&e.code==='quota_exceeded')toast('保存領域がいっぱいです');dirty[k]=1;next();});
  })();
}
/* ---------- helpers ---------- */
function proj(){var s=D.settings;return s.projects.filter(function(p){return p.id===s.projectId;})[0]||s.projects[0];}
function dayKey(date){return D.settings.projectId+'|'+date;}
function projDays(){var pid=D.settings.projectId;return Object.keys(D.days).filter(function(k){return k.indexOf(pid+'|')===0;}).map(function(k){return D.days[k];}).sort(function(a,b){return a.date<b.date?1:-1;});}
function cam(k){return D.settings.cams[k||D.settings.activeCam];}
function shown(c,k){
  if(k==='lens'||k==='iris'||k==='wb'||k==='lensType')return c[k]==='その他'?((c[k+'Custom']||'').trim()||'その他'):(c[k]||'');
  return c[k];
}
function script(){return D.scripts[D.settings.projectId]||null;}
function sceneNum(x){var m=String(x||'').match(/^\d+/);return m?m[0]:null;}
function findScene(x){var sc=script(),n=sceneNum(x);if(!sc||!n)return null;for(var i=0;i<sc.scenes.length;i++)if(sc.scenes[i].no===n)return sc.scenes[i];return null;}
function firstLine(sc){for(var i=0;i<sc.body.length;i++)if(sc.body[i]!=='×')return sc.body[i];return '';}
function sceneStatus(no){var r={takes:0,ok:0};projDays().forEach(function(d){d.takes.forEach(function(t){if(sceneNum(t.scene)===no){r.takes++;if(t.status==='OK')r.ok++;}});});return r;}
function bodyHtml(sc){return sc.body.map(function(p){if(p==='×')return '<div class="x">×　×　×</div>';var m=p.match(/^([^「」（）]{1,8})「([\s\S]*)$/);if(m)return '<div class="dl"><b>'+esc(m[1])+'</b>「'+esc(m[2])+'</div>';return '<div>'+esc(p)+'</div>';}).join('');}
function isIns(c){return String(c).indexOf('インサート')===0;}
function takeTaken(sc,ct,tk){var ses=D.settings.session;if(!ses)return false;var day=D.days[dayKey(ses.date)];if(!day)return false;return day.takes.some(function(t){return String(t.scene)===String(sc)&&String(t.cut)===String(ct)&&+t.take===+tk;});}
function freeTake(sc,ct){var ses=D.settings.session,day=ses&&D.days[dayKey(ses.date)],m=0;if(day)day.takes.forEach(function(t){if(String(t.scene)===String(sc)&&String(t.cut)===String(ct))m=Math.max(m,+t.take||0);});return m+1;}
function camCounts(day){var o={};CAMS.forEach(function(k){o[k]=0;});(day.takes||[]).forEach(function(t){var cs=t.cams&&t.cams.length?t.cams:[(t.cam||'A').charAt(0)];cs.forEach(function(k){if(o[k]!=null)o[k]++;});});return o;}
function nextCut(c){var m=String(c).match(/^(\d+)/);return m?String(parseInt(m[1],10)+1):String(c);}
function lit(){var r=D.settings.rolling;if(!r){r=D.settings.rolling={};((D.settings.session&&D.settings.session.cams)||['A']).forEach(function(k){r[k]=true;});}return CAMS.filter(function(k){return r[k];});}
function wheelHtml(id,items,label){return '<div class="wheelbox">'+(label?'<div class="sec" style="text-align:center;margin-bottom:4px">'+label+'</div>':'')+'<div style="position:relative"><div class="wband"></div><div class="wheel" id="'+id+'"><div class="wpad"></div>'+items.map(function(it,i){return '<div class="wi" data-wi="'+i+'">'+it.label+'</div>';}).join('')+'<div class="wpad"></div></div></div></div>';}
function initWheel(id,items,idx,onChange){
  var el=document.getElementById(id);if(!el)return;var cur=idx,tm=null,IH=44;
  function mark(i){var ws=el.querySelectorAll('.wi');ws.forEach(function(w,j){w.classList.toggle('on',j===i);});}
  el.scrollTop=idx*IH;mark(idx);
  el.addEventListener('scroll',function(){var i=Math.max(0,Math.min(items.length-1,Math.round(el.scrollTop/IH)));mark(i);clearTimeout(tm);tm=setTimeout(function(){if(i!==cur){cur=i;onChange(items[i].v);}},90);});
  el.addEventListener('click',function(e){var w=e.target.closest('.wi');if(!w)return;var i=+w.dataset.wi;el.scrollTo({top:i*IH,behavior:'smooth'});});
}
function splitNo(v){var m=String(v||'').match(/^(\d+)(.*)$/);return m?{n:+m[1],x:m[2]}:{n:1,x:''};}
function applyCur(key,v){var cu=D.settings.cur;v=String(v).trim();if(!v)return;if(key==='scene'&&v!==String(cu.scene)){cu.cut='1';cu.take=1;}else if(key==='cut'&&v!==String(cu.cut)){cu.take=1;}cu[key]=v;touchSettings();}
function incMedia(v){var m=String(v||'').match(/^(.*?)(\d+)$/);if(!m)return v;var n=String(parseInt(m[2],10)+1);while(n.length<m[2].length)n='0'+n;return m[1]+n;}
function ndLabel(v){for(var i=0;i<ND.length;i++)if(ND[i][0]===v)return ND[i][1];return v;}
function filterText(c){return 'ND '+ndLabel(c.nd)+((c.fx||'').trim()?' ・ '+c.fx.trim():'');}
function camSnap(k){var c=cam(k);return {cam:k,media:(c.media||'').trim(),body:c.body,lensType:shown(c,'lensType'),lens:shown(c,'lens'),iris:shown(c,'iris'),tstop:c.tstop||'',wb:shown(c,'wb'),nd:ndLabel(c.nd),fx:(c.fx||'').trim(),iso:c.iso,shutter:c.shutter,fps:c.fps,format:c.format};}

/* TC */
function base(f){return Math.round(FPSR[f]||24);}
function tcFrames(k){
  var c=cam(k),f=c.fps,b=base(f),sy=D.settings.tc[k],now=Date.now(),day=86400*b,fr;
  if(sy&&sy.fps===f){fr=sy.F0+(now-sy.t0)/1000*FPSR[f];}
  else{var d=new Date();fr=((d.getHours()*60+d.getMinutes())*60+d.getSeconds()+d.getMilliseconds()/1000)*b;}
  fr=Math.floor(fr)%day;if(fr<0)fr+=day;return fr;
}
function fmtTC(fr,f){var b=base(f),ff=fr%b,s=Math.floor(fr/b),h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60;return pad(h)+':'+pad(m)+':'+pad(s%60)+':'+pad(ff);}
function parseTC(str,f){
  var d=tcDigits(str);if(d.length===6)d+='00';if(d.length!==8)return null;
  var h=+d.slice(0,2),m=+d.slice(2,4),s=+d.slice(4,6),ff=+d.slice(6,8),b=base(f);
  if(h>23||m>59||s>59||ff>=b)return null;return ((h*60+m)*60+s)*b+ff;
}
function tcDigits(str){return String(str||'').replace(/[\uFF10-\uFF19]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[^0-9]/g,'').slice(0,8);}
function tcFormat(d){return (d.match(/.{1,2}/g)||[]).join(':');}
function durOf(t){if(t.inF==null||t.outF==null)return'';var b=base(t.fps||'24'),d=t.outF-t.inF;if(d<0)d+=86400*b;var s=Math.round(d/b);return Math.floor(s/60)+':'+pad(s%60);}
function dateOfMs(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function syncState(k){var sy=D.settings.tc[k];if(!sy)return 'none';if(sy.fps!==cam(k).fps)return 'fps';return dateOfMs(sy.t0)===today()?'ok':'old';}

/* ---------- actions ---------- */
function commit(force){
  var s=D.settings,ses=s.session,k=s.activeCam,r=S.rec;if(!r.status)return;
  if(!force&&takeTaken(s.cur.scene,s.cur.cut,s.cur.take)){openSheet({type:'dup',n:freeTake(s.cur.scene,s.cur.cut)});return;}
  var key=dayKey(ses.date),day=D.days[key];
  if(!day)day=D.days[key]={projectId:s.projectId,date:ses.date,takes:[],updatedAt:0};
  var Lc=lit();if(!Lc.length)return;k=Lc.indexOf(k)>=0?k:Lc[0];var snap=camSnap(Lc[0]),now=Date.now();
  var t={id:uid('t'),date:ses.date,scene:String(s.cur.scene),cut:String(s.cur.cut),take:s.cur.take,status:r.status,reasons:REASONS.filter(function(x){return r.reasons[x];}),memo:r.memo.trim(),time:clock(r.markedAt||now),markedAt:r.markedAt||now,createdAt:now,createdLabel:nowStamp(),updatedAt:now,history:[]};
  for(var x in snap)t[x]=snap[x];
  t.cams=Lc.slice();t.cam=Lc.join('+');t.camSets={};Lc.forEach(function(q){t.camSets[q]=camSnap(q);s.lastCam[q]=clone(cam(q));});
  t.media=Lc.map(function(q){return (cam(q).media||'').trim();}).filter(Boolean).join(' / ');
  if(t.status!=='NG')t.reasons=[];
  day.takes.push(t);day.updatedAt=now;
  s.lastCam[k]=clone(cam(k));
  if(t.status==='OK'&&!isIns(s.cur.cut)){s.cur.cut=nextCut(s.cur.cut);s.cur.take=1;}else s.cur.take+=1;
  s.updatedAt=now;
  S.rec={status:null,reasons:{},memo:'',markedAt:null};
  persist([key,'settings']);render();toast('S'+t.scene+'-C'+t.cut+'-T'+t.take+' を記録しました');
}

function applyText(){
  var s=S.sheet,v=String(s.value).trim();if(!v){closeSheet();return;}
  if(s.target==='cur'){var cu=D.settings.cur;if(s.key==='scene'&&v!==String(cu.scene)){cu.cut='1';cu.take=1;}else if(s.key==='cut'&&v!==String(cu.cut)){cu.take=1;}cu[s.key]=v;}
  else if(s.target==='cam'){cam(s.cam)[s.key]=v;if(s.key==='fps'&&D.settings.tc[s.cam]&&D.settings.tc[s.cam].fps!==v)toast('fpsを変えたのでTCを合わせ直してください');}
  touchSettings();closeSheet();
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='camTC'){var dg=tcDigits(t.value);t.value=tcFormat(dg);S.tcDraft=t.value;}
  if(t.dataset.bind){setDeep(t.dataset.bind,t.value);if(t.dataset.bind.indexOf('rec.')===0){}}
  if(t.dataset.cbind&&S.sheet){cam(S.sheet.cam)[t.dataset.cbind]=t.value;D.settings.updatedAt=Date.now();clearTimeout(t._sv);t._sv=setTimeout(function(){touchSettings();},500);}
});
document.addEventListener('change',function(e){
  if(S.view==='edit'&&/^draft\.(scene|cut|take)$/.test(e.target.dataset.bind||'')){render();return;}
  if(e.target.id==='restoreFile'&&e.target.files[0]){var rf=new FileReader();rf.onload=function(){try{var o=JSON.parse(rf.result);if(!o.settings||!o.days)throw 0;if(!o.scripts)o.scripts={};D=o;persist();S.view='home';prevViews=[];render();toast('バックアップを読み込みました');}catch(x){toast('バックアップファイルを読めませんでした');}};rf.readAsText(e.target.files[0]);return;}
  if(e.target.id!=='scriptFile'||!e.target.files[0])return;
  var fr=new FileReader();fr.onload=function(){try{loadScriptObj(JSON.parse(fr.result));}catch(x){toast('台本データを読めませんでした');}};fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sheetInput'){S.sheet.value=e.target.value;applyText();}});

render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
})();
</script>
</body>
</html>
